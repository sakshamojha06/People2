<div class="edit-person-container">

  <h2>Edit Person</h2>

  <form (ngSubmit)="updatePerson()">

    <div class="form-group">
      <label>Name</label>

      <input
        type="text"
        class="form-control"
        name="name"
        [(ngModel)]="person.name"
        required>
    </div>

    <div class="form-group">
      <label>Date of Birth</label>

      <input
        type="date"
        class="form-control"
        name="dateOfBirth"
        [(ngModel)]="person.dateOfBirth"
        required>
    </div>

    <div class="form-actions">
      <button
        type="button"
        class="btn btn-secondary me-2"
        (click)="goBack()">
        Cancel
      </button>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-pencil-square"></i>
        Update
      </button>
    </div>

  </form>

</div>
